name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'ChrisTitusTech/linutil'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.0
      HUGO_ENVIRONMENT: production
      TZ: America/Chicago
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The homepage menu and the walkthrough show the latest release, which is what the installer
      # downloads, rather than whatever has landed on main since.
      - name: Use the catalog from the latest release
        run: git checkout "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" -- core/tabs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate the walkthrough
        run: cargo xtask docgen

      - name: Build with Hugo
        run: hugo --gc --minify --source docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/public

  deploy:
    if: github.repository == 'ChrisTitusTech/linutil'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
