[params]
description = "Chris Titus Tech's Linux Utility - Install Programs, Tweaks, Fixes, and Updates"
editURL = "https://github.com/ChrisTitusTech/linutil/edit/main/docs/content/"

  [[params.social]]
  name = "GitHub"
  icon = "github"
  url = "https://github.com/ChrisTitusTech/linutil"

  [[params.social]]
  name = "Discord"
  icon = "discord"
  url = "https://discord.gg/RUbZUZyByQ"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.renderHooks.link]
      useEmbedded = "fallback"
    [markup.goldmark.renderHooks.image]
      useEmbedded = "fallback"
  [markup.highlight]
    noClasses = false
