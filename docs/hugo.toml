baseURL = "https://linutil.christitus.com/"
locale = "en-us"
title = "Linutil Documentation"
enableGitInfo = true
canonifyURLs = true
disableKinds = ["taxonomy", "term", "rss"]

[outputs]
home = ["html", "json"]

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "../.github"
  target = "static"
  files = "preview.gif"

# The homepage menu is built from the same catalog the TUI loads.
[[module.mounts]]
  source = "../core/tabs"
  target = "data/tabs"
  files = ["tabs.toml", "*/tab_data.toml"]

[[menu.main]]
identifier = "documentation"
name = "Documentation"
weight = 1

[[menu.main]]
identifier = "userguide"
name = "User Guides"
pageRef = "/userguide"
weight = 1
parent = "documentation"

[[menu.main]]
identifier = "contribution-guides"
name = "Contribution Guides"
pageRef = "CONTRIBUTING.md"
weight = 2
parent = "documentation"

[[menu.main]]
identifier = "developer-documentation"
name = "Developer Docs"
pageRef = "/dev"
weight = 3
parent = "documentation"

[[menu.main]]
identifier = "help"
name = "Help"
weight = 2

[[menu.main]]
identifier = "faq"
name = "FAQ"
pageRef = "faq.md"
weight = 1
parent = "help"

[[menu.main]]
identifier = "known-issues"
name = "Known Issues"
pageRef = "KnownIssues.md"
weight = 2
parent = "help"

[[menu.main]]
identifier = "forums"
name = "Forums"
url = "https://forum.christitus.com/"
weight = 3
parent = "help"

# Sections listed here show all of their pages in the sidebar, ordered by weight.
[[menu.sidebar]]
