<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#_top">Skip to content</a>
  {{- partial "header.html" . }}
  {{- block "main" . }}{{ end }}
  {{- partial "search.html" . }}
  {{- partial "status-bar.html" . }}
  {{- $js := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
  {{- block "scripts" . }}{{ end }}
</body>
</html>
