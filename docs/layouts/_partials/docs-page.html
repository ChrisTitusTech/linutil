{{- $segments := split (strings.Trim .RelPermalink "/") "/" }}
<div class="docs">
  {{- partial "sidebar.html" . }}
  <div class="docs-main">
    <main class="docs-article">
      <div class="page-title" id="_top" tabindex="-1">
        <p class="page-path">
          <span class="prompt">~</span>
          {{- range $i, $segment := $segments }}/{{ if eq (add $i 1) (len $segments) }}<b>{{ . }}</b>{{ else }}{{ . }}{{ end }}{{ end -}}
        </p>
        {{- with .Title }}
          <h1>{{ . }}</h1>
        {{- end }}
      </div>
      <div class="content">
        {{ .Content }}
      </div>
    </main>
  </div>
</div>
